name: Build Dobby arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dobby at stable tag
        uses: actions/checkout@v4
        with:
          repository: jmpews/Dobby
          ref: latest
          fetch-depth: 0
      - name: Patch asm directives
        run: |
          python3 - <<'PY'
          p="source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          s=open(p,encoding='utf-8').read()
          before=s
          s=s.replace("common_closure_bridge_handler@PAGEOFF",":lo12:common_closure_bridge_handler")
          s=s.replace("common_closure_bridge_handler@PAGE",":pg_hi21:common_closure_bridge_handler")
          open(p,"w",encoding='utf-8').write(s)
          print("CHANGED:", before!=s)
          for i,l in enumerate(s.splitlines(),1):
              if "common_closure_bridge_handler" in l:
                  print(i, l)
          PY


           - name: Patch broken sources
        run: |
          # 1) 给 os_arch_features.h 补 OSMemory 头（多路径自适应）
          F="common/os_arch_features.h"
          {
            echo '// injected by CI to fix missing OSMemory'
            echo '#if __has_include("source/PlatformUnifiedInterface/OSMemory.h")'
            echo '#include "source/PlatformUnifiedInterface/OSMemory.h"'
            echo '#elif __has_include("PlatformUnifiedInterface/OSMemory.h")'
            echo '#include "PlatformUnifiedInterface/OSMemory.h"'
            echo '#elif __has_include("source/Backend/UserMode/UnifiedInterface/OSMemory.h")'
            echo '#include "source/Backend/UserMode/UnifiedInterface/OSMemory.h"'
            echo '#endif'
            cat "$F"
          } > /tmp/oa && mv /tmp/oa "$F"

          # 2) 把半成品旧文件从编译列表剔除
          sed -i '/Backend\/UserMode\/PlatformUtil\/Linux\/ProcessRuntime\.cc/d' CMakeLists.txt || true
          sed -i '/Backend\/UserMode\/ExecMemory\/code-patch-tool-posix\.cc/d' CMakeLists.txt || true

      - name: Dump sources for diagnosis
        if: always()
        run: |
          echo "=== locate headers ==="
          find . \( -name OSMemory.h -o -name ProcessRuntime.h -o -name code-patch-tool*.cc \) -print
          echo "=== RuntimeModule struct ==="
          grep -rn -A 18 'struct RuntimeModule' source/ | head -50 || true
          echo "=== code-patch-tool-posix.cc head ==="
          sed -n '1,20p' source/Backend/UserMode/ExecMemory/code-patch-tool-posix.cc || true

      - name: Setup NDK r25b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_TRAMPOLINE_ASM=OFF \
            -DDOBBY_DEBUG=OFF

      - name: Build dobby_static
        run: cmake --build build --target dobby_static -j4

      - name: Inspect strings
        if: always()
        run: |
          A=$(find build -name "libdobby.a" | head -1)
          if [ -n "$A" ]; then ls -l "$A"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdobby-arm64-v8a
          path: build/**/libdobby.a
          if-no-files-found: error
